
name: Construire CACVision.exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install yfinance
          pip install matplotlib
          pip install pandas

      - name: Vérifier les fichiers
        run: |
          dir
          if (!(Test-Path "Actions.py")) {
            Write-Error "Actions.py introuvable"
            exit 1
          }
          if (!(Test-Path "icon.ico")) {
            Write-Error "icon.ico introuvable"
            exit 1
          }

      - name: Construire CACVision.exe
        run: |
          pyinstaller --onefile --windowed --name CACVision --icon=icon.ico CACVision.py

      - name: Mettre le fichier dans un ZIP
        run: |
          Compress-Archive -Path dist\CACVision.exe -DestinationPath CACVision-Windows.zip

      - name: Publier CACVision.exe
        uses: actions/upload-artifact@v4
        with:
          name: CACVision-Windows
          path: CACVision-Windows.zip

